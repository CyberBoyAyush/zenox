name: CI

# Runs on instabox machines (https://instabox.sh/docs/ci.md): every job gets a fresh
# Ubuntu 24.04 VM, deleted when the job ends. No secrets are used or needed.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: instabox-medium
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: typecheck (src + tests)
        run: bun run typecheck
      - name: unit tests
        run: bun test
      - run: bun run build
      # Zenox inside the real OpenCode engine (in-memory database, fake model API, no network).
      - name: e2e (sources)
        run: bun run test:e2e
      - name: e2e (built bundle that ships to npm)
        run: bun run test:e2e:dist
      - name: package loads under Node
        run: |
          node --input-type=module -e "
            const { default: plugin } = await import('./dist/index.js')
            if (plugin.id !== 'zenox' || typeof plugin.setup !== 'function') throw new Error('bad plugin export')
            const tui = await import('./dist/tui.js')
            if (!tui.default) throw new Error('missing tui export')
          "
          node dist/cli/index.js --help > /dev/null
      - name: package contents
        run: |
          npm pack --dry-run --json > pack.json
          node -e "
            const json = require('./pack.json')
            // npm <= 11 prints an array, npm 12 an object keyed by package name.
            const files = (Array.isArray(json) ? json[0] : Object.values(json)[0]).files.map(f => f.path)
            for (const need of ['dist/index.js', 'dist/tui.js', 'dist/cli/index.js', 'dist/index.d.ts', 'skills/frontend-design/SKILL.md', 'skills/grill-me/SKILL.md'])
              if (!files.includes(need)) throw new Error('missing from package: ' + need)
            const leaked = files.filter(f => f.startsWith('test/') || f.startsWith('src/') || f.endsWith('.env'))
            if (leaked.length) throw new Error('unexpected files in package: ' + leaked.join(', '))
            console.log(files.length + ' files OK')
          "
